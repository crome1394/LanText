<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0e3a31;
      color: #f4fbf8;
    }
    body {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 36px;
      padding: 56px 64px;
      background:
        radial-gradient(ellipse at 12% 20%, #1f8a70 0%, transparent 46%),
        linear-gradient(135deg, #0b2e27 0%, #156B57 55%, #0e3a31 100%);
    }
    .mark {
      width: 180px;
      height: 180px;
      align-self: center;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.28));
    }
    .copy { align-self: center; }
    h1 {
      margin: 0 0 10px;
      font-size: 72px;
      letter-spacing: -0.04em;
      font-weight: 750;
      line-height: 1;
    }
    p {
      margin: 0 0 28px;
      font-size: 26px;
      color: #d7efe6;
      max-width: 640px;
      line-height: 1.25;
    }
    .pills { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 16px;
      font-weight: 600;
      color: #e8fff6;
    }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" rx="112" fill="#ffffff"/>
    <path fill="#156B57" d="M96 150h320c18 0 32 14 32 32v168c0 18-14 32-32 32H304l-48 72-48-72H96c-18 0-32-14-32-32V182c0-18 14-32 32-32z"/>
    <rect x="152" y="230" width="208" height="28" rx="8" fill="#ffffff"/>
    <rect x="152" y="286" width="136" height="28" rx="8" fill="#ffffff"/>
  </svg>
  <div class="copy">
    <h1>LanText</h1>
    <p>SMS from your computer. Never leaves your Wi-Fi.</p>
    <div class="pills">
      <span class="pill">No cloud</span>
      <span class="pill">No default-app swap</span>
      <span class="pill">Wi-Fi only</span>
    </div>
  </div>
</body>
</html>
