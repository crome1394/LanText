<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body, .app {
      margin: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f3f6f4;
      color: #14201a;
    }
    .app { display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 20px;
      padding: 28px 32px;
      background: #fff;
      border-bottom: 1px solid #d8e0db;
    }
    .back { font-size: 48px; width: 56px; }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: #156B57; color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 28px;
    }
    h2 { margin: 0; font-size: 34px; }
    .muted { margin: 4px 0 0; color: #5b6b63; font-size: 22px; }
    .messages {
      flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 16px;
    }
    .day { align-self: center; color: #5b6b63; font-size: 22px; margin: 8px 0; }
    .bubble {
      max-width: 72%;
      padding: 20px 24px;
      border-radius: 24px;
      font-size: 30px;
      line-height: 1.35;
    }
    .in { background: #e8eeea; align-self: flex-start; border-bottom-left-radius: 6px; }
    .out { background: #1f8a70; color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
    .pic {
      width: 420px; height: 280px; border-radius: 16px;
      background:
        linear-gradient(160deg, #87c4b3 0%, #1f8a70 40%, #0e3a31 100%);
      margin-bottom: 10px;
    }
    .meta { font-size: 18px; opacity: 0.75; margin-top: 8px; }
    .composer {
      display: flex; gap: 12px; align-items: flex-end;
      padding: 24px 28px 36px;
      background: #fff; border-top: 1px solid #d8e0db;
    }
    .attach {
      width: 72px; height: 72px; border-radius: 50%;
      background: #f3f6f4; display: grid; place-items: center; font-size: 32px;
    }
    .box {
      flex: 1; border: 1px solid #d8e0db; background: #f3f6f4;
      border-radius: 18px; padding: 22px 24px; color: #5b6b63; font-size: 28px;
    }
    .send {
      background: #156B57; color: #fff; border-radius: 999px;
      padding: 22px 28px; font-size: 28px; font-weight: 650;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="back">‹</div>
      <div class="avatar">J</div>
      <div>
        <h2>Jordan</h2>
        <p class="muted">+1 555 010 4420</p>
      </div>
    </header>
    <div class="messages">
      <div class="day">Today</div>
      <div class="bubble in">On the trail. Signal is awful but the view is not.<div class="meta">10:02</div></div>
      <div class="bubble out">Send a picture when you can.<div class="meta">10:04</div></div>
      <div class="bubble in">
        <div class="pic"></div>
        From the ridge
        <div class="meta">10:11</div>
      </div>
      <div class="bubble out">That looks cold. Text me when you are down.<div class="meta">10:12</div></div>
    </div>
    <div class="composer">
      <div class="attach">📎</div>
      <div class="box">Message or paste a picture</div>
      <div class="send">Send</div>
    </div>
  </div>
</body>
</html>
